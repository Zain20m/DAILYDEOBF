name: Check JavaScript syntax

on:
  push:
    paths:
      - 'index.js'
      - 'scripts/setup-beautify.js'
      - 'scripts/engine-detection.js'
      - 'scripts/imported-engine-runner.js'
      - 'scripts/setup-imported-engines.py'
      - 'deobfuscators/**'
      - 'luast-engine/**'
      - 'scripts/setup-engines.js'
      - 'scripts/beautify.py'
      - 'scripts/luau_ast.py'
      - 'beautify-requirements.txt'
      - 'fulcrum-engine/**'
      - 'pureluau.js'
      - 'scripts/automatic-pureluau.js'
      - 'scripts/test-automatic-pureluau.js'
      - 'luraph-v15.1-engine/src/parallel.js'
      - '.github/workflows/check-javascript-syntax.yml'
  pull_request:
    paths:
      - 'index.js'
      - '.github/workflows/check-javascript-syntax.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          node --check index.js
          node --check scripts/setup-beautify.js
          node --check scripts/engine-detection.js
          node --check scripts/imported-engine-runner.js
          node --check scripts/setup-engines.js
          node --check pureluau.js
          node --check scripts/automatic-pureluau.js
          node --check scripts/test-automatic-pureluau.js
          node --check luraph-v15.1-engine/src/parallel.js

      - name: Check Fulcrum Python engine
        run: |
          python3 -m py_compile fulcrum-engine/*.py scripts/beautify.py scripts/luau_ast.py scripts/setup-imported-engines.py
          python3 fulcrum-engine/fulcrum_deobf.py --help
