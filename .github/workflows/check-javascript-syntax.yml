name: Check JavaScript syntax

on:
  push:
    paths:
      - 'index.js'
      - '.github/workflows/check-javascript-syntax.yml'
  pull_request:
    paths:
      - 'index.js'
      - '.github/workflows/check-javascript-syntax.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check index.js
