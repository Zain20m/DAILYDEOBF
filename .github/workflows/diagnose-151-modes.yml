name: Diagnose Luraph 15.1 analysis modes

on:
  push:
    paths:
      - "upload/DIAGNOSE_151_TRIGGER.txt"

permissions:
  contents: read

jobs:
  modes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compare standard, full-round, loader and debug modes
        shell: bash
        run: |
          set -u
          sudo apt-get update -qq
          sudo apt-get install -y 7zip
          SEVEN="$(command -v 7zz || command -v 7z)"
          export SEVEN
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os, subprocess, tempfile

          wrapper = Path("upload/Luraph_v15_1_Deobfuscator_Newest.zip")
          with ZipFile(wrapper) as z:
              rars = [x for x in z.infolist() if x.filename.lower().endswith(".rar")]
              if len(rars) != 1:
                  raise SystemExit("Expected one nested RAR")
              rar_data = z.read(rars[0])

          with tempfile.TemporaryDirectory(prefix="daily-deobf-151-modes-") as td:
              root = Path(td)
              rar = root / "payload.rar"
              extracted = root / "extract"
              extracted.mkdir()
              rar.write_bytes(rar_data)
              subprocess.run([os.environ["SEVEN"], "x", "-y", f"-o{extracted}", str(rar)], check=True, capture_output=True)
              sample = extracted / "v15_tool_attempt_source/samples_v15.1_deobfuscated/2153b779fa7a87f2_obfuscated.lua"
              if not sample.is_file():
                  raise SystemExit("15.1 sample not found")

              cases = [
                  ("baseline", {}, False, ["--max-runs", "12", "--devirt-rounds", "200", "--budget", "30", "--timeout", "90"]),
                  ("full_rounds", {"DEVIRT_FULL_ROUNDS":"1"}, False, ["--max-runs", "12", "--devirt-rounds", "200", "--budget", "30", "--timeout", "90"]),
                  ("loader_analysis", {"DEVIRT_LOADERS":"1"}, False, ["--max-runs", "12", "--devirt-rounds", "200", "--budget", "30", "--timeout", "90"]),
                  ("debug_artifacts", {}, True, ["--max-runs", "12", "--devirt-rounds", "200", "--budget", "30", "--timeout", "90"]),
              ]

              for name, extra_env, debug, options in cases:
                  case_dir = root / name
                  case_dir.mkdir()
                  output = case_dir / "result.luau"
                  env = os.environ.copy()
                  for key in (
                      "DEVIRT_FULL_ROUNDS", "DEVIRT_LOADERS", "DEVIRT_TIMING",
                      "DEVIRT_ERRS", "DEVIRT_TB", "DEVIRT_WALK_LIMIT"
                  ):
                      env.pop(key, None)
                  env.update(extra_env)
                  args = [
                      "node", str(Path("luraph-v15.1-engine/deob.js").resolve()),
                      str(sample), "-o", str(output), "--plugin", "luraph_v15",
                  ]
                  if debug:
                      args.append("--debug")
                  args += options
                  print(f"\n===== CASE {name} =====", flush=True)
                  try:
                      result = subprocess.run(
                          args, cwd="luraph-v15.1-engine", env=env,
                          capture_output=True, text=True, timeout=420
                      )
                      print("EXIT=" + str(result.returncode))
                      print("OUTPUT_BYTES=" + str(output.stat().st_size if output.exists() else 0))
                      print("STDOUT:\n" + result.stdout[-2500:])
                      print("STDERR:\n" + result.stderr[-7000:])
                      if debug:
                          side = case_dir
                          for p in sorted(side.iterdir()):
                              if p.is_file():
                                  print("ARTIFACT " + p.name + " " + str(p.stat().st_size))
                  except subprocess.TimeoutExpired as exc:
                      print("TIMEOUT after 420s")
                      print("STDERR:\n" + str(exc.stderr)[-7000:])
          PY
