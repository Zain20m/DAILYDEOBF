name: Replace Luraph 15.1 engine from newest upload

on:
  push:
    paths:
      - "upload/Luraph_v15_1_Deobfuscator_Newest.zip"
      - "upload/IMPORT_151_TRIGGER.txt"
      - ".github/workflows/import-luraph151.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract the uploaded ZIP and import the replacement engine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil
          import subprocess
          import tempfile

          root = Path.cwd()
          archive = root / "upload/Luraph_v15.1_Deobfuscator.zip"
          if not archive.is_file():
              raise SystemExit(f"Missing uploaded archive: {archive}")

          with tempfile.TemporaryDirectory(prefix="daily-deobf-151-") as temp:
              temp_root = Path(temp)
              extracted = temp_root / "extracted"
              extracted.mkdir()

              with ZipFile(archive) as z:
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f"ZIP CRC check failed: {bad}")
                  entries = [entry for entry in z.infolist() if not entry.is_dir()]
                  if len(entries) > 5000:
                      raise SystemExit(f"ZIP has too many files: {len(entries)}")
                  total = sum(entry.file_size for entry in entries)
                  if total > 256 * 1024 * 1024:
                      raise SystemExit(f"ZIP is too large to import: {total} bytes")
                  for entry in entries:
                      name = entry.filename.replace("\\", "/")
                      safe = PurePosixPath(name)
                      if safe.is_absolute() or ".." in safe.parts:
                          raise SystemExit(f"Unsafe ZIP path: {entry.filename}")
                      target = extracted.joinpath(*safe.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(entry) as src, target.open("wb") as dst:
                          shutil.copyfileobj(src, dst)

              required = [
                  "deob.js",
                  "package.json",
                  "protocol.json",
                  "src/driver.js",
                  "src/harness.js",
                  "core/obfuscators/luraph_v15/devirt.py",
                  "core/obfuscators/luraph_v15/driver.py",
                  "runtime/envlog.luau",
                  "runtime/roblox_api.luau",
                  "bin/luau",
                  "bin/luau-ast",
              ]
              candidates = [
                  directory for directory in extracted.rglob("deob.js")
                  if directory.is_file()
              ]
              source = None
              for entry in candidates:
                  candidate = entry.parent
                  if all((candidate / name).is_file() for name in required):
                      source = candidate
                      break
              if source is None:
                  raise SystemExit(
                      "Could not find a complete Luraph v15.1 engine root in the uploaded ZIP."
                  )

              destination = root / "luraph-v15.1-engine"
              if destination.exists():
                  shutil.rmtree(destination)
              shutil.copytree(
                  source,
                  destination,
                  ignore=shutil.ignore_patterns("__pycache__", "*.pyc", "*.exe", ".DS_Store"),
              )
              for binary in (destination / "bin/luau", destination / "bin/luau-ast"):
                  binary.chmod(0o755)

              for js in destination.rglob("*.js"):
                  subprocess.run(
                      ["node", "--check", str(js)],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
              for py in destination.rglob("*.py"):
                  if "__pycache__" not in py.parts:
                      compile(py.read_text(encoding="utf-8"), str(py), "exec")

              samples = sorted(
                  path for path in destination.rglob("*_obfuscated.lua")
                  if path.is_file()
              )
              if not samples:
                  raise SystemExit("The uploaded engine ZIP contains no bundled obfuscated sample.")
              sample = samples[0]

              detection = subprocess.run(
                  ["node", str(destination / "deob.js"), str(sample), "--detect"],
                  cwd=destination,
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=30,
              )
              print("15.1 SAMPLE DETECTION:")
              print(detection.stdout.strip())
              if "luraph_v15" not in detection.stdout:
                  raise SystemExit("The imported engine did not recognize its bundled Luraph sample.")

              output = temp_root / "deobfuscated-sample.luau"
              result = subprocess.run(
                  [
                      "node", str(destination / "deob.js"), str(sample),
                      "-o", str(output),
                      "--plugin", "luraph_v15",
                      "--budget", "30",
                      "--timeout", "120",
                  ],
                  cwd=destination,
                  capture_output=True,
                  text=True,
                  timeout=420,
              )
              if result.returncode != 0 or not output.is_file() or output.stat().st_size == 0:
                  print("ENGINE STDOUT:")
                  print(result.stdout[-6000:])
                  print("ENGINE STDERR:")
                  print(result.stderr[-12000:])
                  raise SystemExit("The imported engine failed its bundled sample test.")
              print(f"15.1 SAMPLE TEST PASSED: {output.stat().st_size} output bytes")

          print("IMPORTED_REPLACEMENT_ENGINE_OK")
          PY

      - name: Verify current Discord integration was preserved
        shell: bash
        run: |
          set -euo pipefail
          node --check index.js
          node --check luraph-v15.1-engine/deob.js
          node --check luraph-v15.1-engine/src/detect.js
          node --check luraph-v15.1-engine/src/driver.js
          node --check luraph-v15.1-engine/src/harness.js
          python3 - <<'PY'
          from pathlib import Path
          app = Path("index.js").read_text(encoding="utf-8")
          setup = Path("scripts/setup-engines.js").read_text(encoding="utf-8")
          required_app = (
              "const ENGINE_151_CLI = path.join(ENGINE_151_DIR, 'deob.js');",
              "async function processLuraph151(",
              "ENGINE_151_CLI,",
              "'--plugin', 'luraph_v15'",
          )
          missing = [item for item in required_app if item not in app]
          if missing:
              raise SystemExit("Current Discord integration is missing: " + ", ".join(missing))
          if "'luraph-v15.1-engine'" not in setup or "'deob.js'" not in setup:
              raise SystemExit("Engine setup validation no longer includes the v15.1 engine.")
          print("CURRENT_151_DISCORD_INTEGRATION_OK")
          PY

      - name: Commit only the replacement engine files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- luraph-v15.1-engine
          if git diff --cached --quiet; then
            echo 'Imported engine is identical; no replacement changes to commit.'
            exit 0
          fi
          git commit -m 'Replace Luraph 15.1 engine with newest archive'
          git push
