name: Import separate Luraph 15.1 engine

on:
  push:
    paths:
      - "upload/Luraph_v15_1_Deobfuscator_Newest.zip"
      - "upload/IMPORT_151_TRIGGER.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unwrap ZIP, install engine, and run compatibility test
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y 7zip
          SEVEN="$(command -v 7zz || command -v 7z)"
          export SEVEN
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import os
          import shutil
          import subprocess
          import tempfile
          import json

          root = Path.cwd()
          wrapper = root / "upload/Luraph_v15_1_Deobfuscator_Newest.zip"
          if not wrapper.is_file():
              raise SystemExit(f"Missing uploaded archive: {wrapper}")

          with ZipFile(wrapper) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC check failed: {bad}")
              files = [entry for entry in z.infolist() if not entry.is_dir()]
              if len(files) != 1 or not files[0].filename.lower().endswith(".rar"):
                  raise SystemExit("Expected the uploaded ZIP to contain exactly one RAR file.")
              rar_bytes = z.read(files[0])

          seven = os.environ["SEVEN"]
          destination = root / "luraph-v15.1-engine"

          with tempfile.TemporaryDirectory(prefix="daily-deobf-151-") as temp:
              temp_root = Path(temp)
              rar = temp_root / "payload.rar"
              extracted = temp_root / "rar"
              extracted.mkdir()
              rar.write_bytes(rar_bytes)

              subprocess.run([seven, "t", str(rar)], check=True, capture_output=True, text=True)
              listing = subprocess.run(
                  [seven, "l", "-slt", str(rar)],
                  check=True, capture_output=True, text=True
              ).stdout

              records, current = [], {}
              for line in listing.split("----------", 1)[-1].splitlines():
                  if not line.strip():
                      if current:
                          records.append(current)
                          current = {}
                  elif " = " in line:
                      key, value = line.split(" = ", 1)
                      current[key] = value
              if current:
                  records.append(current)

              total = 0
              entry_count = 0
              for record in records:
                  name = record.get("Path", "")
                  if not name or name == str(rar):
                      continue
                  safe_path = PurePosixPath(name.replace("\\", "/"))
                  if safe_path.is_absolute() or ".." in safe_path.parts:
                      raise SystemExit(f"Unsafe RAR path: {name}")
                  if "Symbolic Link" in record.get("Attributes", ""):
                      raise SystemExit(f"Symlink entry is not allowed: {name}")
                  if record.get("Folder") != "+":
                      total += int(record.get("Size", "0") or 0)
                  entry_count += 1

              if entry_count > 5000 or total > 256 * 1024 * 1024:
                  raise SystemExit(f"RAR exceeds extraction limits: {entry_count} entries, {total} bytes")

              subprocess.run(
                  [seven, "x", "-y", f"-o{extracted}", str(rar)],
                  check=True, capture_output=True, text=True
              )

              source = extracted / "v15_tool_attempt_source"
              required = [
                  "deob.js",
                  "package.json",
                  "protocol.json",
                  "src/detect.js",
                  "src/driver.js",
                  "src/harness.js",
                  "src/vmmap.js",
                  "src/pyenv.js",
                  "src/devirt_bridge.py",
                  "core/obfuscators/luraph_v15/__init__.py",
                  "runtime/envlog.luau",
                  "bin/luau",
                  "bin/luau-ast",
              ]
              missing = [name for name in required if not (source / name).is_file()]
              if missing:
                  raise SystemExit("Archive is missing required engine files: " + ", ".join(missing))

              if destination.exists():
                  shutil.rmtree(destination)
              shutil.copytree(
                  source,
                  destination,
                  ignore=shutil.ignore_patterns(
                      "__pycache__", "*.pyc", "*.exe",
                      "samples_v15.1_deobfuscated", ".DS_Store"
                  ),
              )
              for binary in (destination / "bin/luau", destination / "bin/luau-ast"):
                  binary.chmod(0o755)

              for js in destination.rglob("*.js"):
                  subprocess.run(
                      ["node", "--check", str(js)],
                      check=True, capture_output=True, text=True
                  )
              for py in destination.rglob("*.py"):
                  compile(py.read_text(encoding="utf-8"), str(py), "exec")

              sample = source / "samples_v15.1_deobfuscated/2153b779fa7a87f2_obfuscated.lua"
              if not sample.is_file():
                  raise SystemExit("Expected bundled 15.1 sample input is missing.")

              detection = subprocess.run(
                  ["node", str(destination / "deob.js"), str(sample), "--detect"],
                  cwd=destination,
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=30,
              )
              print("15.1 SAMPLE DETECTION:")
              print(detection.stdout.strip())
              if "luraph_v15" not in detection.stdout:
                  raise SystemExit("The engine did not recognize its bundled Luraph 15.1 sample.")

              output = temp_root / "deobfuscated-sample.luau"
              result = subprocess.run(
                  [
                      "node", str(destination / "deob.js"), str(sample),
                      "-o", str(output),
                      "--plugin", "luraph_v15",
                      "--budget", "30",
                      "--timeout", "120",
                  ],
                  cwd=destination,
                  capture_output=True,
                  text=True,
                  timeout=420,
              )
              if result.returncode != 0 or not output.is_file() or output.stat().st_size == 0:
                  print("ENGINE STDOUT:")
                  print(result.stdout[-6000:])
                  print("ENGINE STDERR:")
                  print(result.stderr[-12000:])
                  raise SystemExit("The bundled 15.1 sample deobfuscation test failed.")
              print(f"15.1 SAMPLE TEST PASSED: {output.stat().st_size} output bytes")

          # Wire the existing 15.1 Discord button to the new standalone CLI.
          index_path = root / "index.js"
          app = index_path.read_text(encoding="utf-8")
          old_cli = "const ENGINE_151_CLI = path.join(ENGINE_151_DIR, 'bin', 'luraph-deobf.js');"
          new_cli = "const ENGINE_151_CLI = path.join(ENGINE_151_DIR, 'deob.js');"
          if old_cli not in app:
              raise SystemExit("Could not find the current 15.1 CLI path.")
          app = app.replace(old_cli, new_cli, 1)

          old_signature = "function runEngine(engineDir, engineCli, inputPath, outputPath, timeoutMs, legacy = false) {"
          new_signature = "function runEngine(engineDir, engineCli, inputPath, outputPath, timeoutMs, legacy = false, extraArgs = []) {"
          if old_signature not in app:
              raise SystemExit("Could not find the expected runEngine signature.")
          app = app.replace(old_signature, new_signature, 1)

          old_args = "      ...(legacy ? ['--steps', '180000'] : ['--timeout', '120']),"
          if old_args not in app:
              raise SystemExit("Could not find the expected runEngine argument list.")
          app = app.replace(old_args, old_args + "\n      ...extraArgs,", 1)

          start = app.index("async function processLuraph151(message, prompt, input) {")
          end = app.index("\nasync function startWorkflow", start)
          replacement = r'''async function processLuraph151(message, prompt, input) {
            const tempRoot = await fs.mkdtemp(path.join(os.tmpdir(), 'daily-deobf-151-'));
            const inputPath = path.join(tempRoot, 'input.lua');
            const outDir = path.join(tempRoot, 'output');
            const outputPath = path.join(outDir, 'deobfuscated.luau');
            await fs.mkdir(outDir, { recursive: true });
            await fs.writeFile(inputPath, input.source, { encoding: 'utf8', mode: 0o600 });

            try {
              await prompt.edit({ content: 'Running Luraph 15.1 with the replacement engine...', components: [] });
              await runEngine(
                ENGINE_151_DIR,
                ENGINE_151_CLI,
                inputPath,
                outputPath,
                ENGINE_TIMEOUT_MS,
                false,
                ['--plugin', 'luraph_v15', '--budget', '30'],
              );

              const data = await fs.readFile(outputPath);
              if (!data.length) throw new Error('The engine returned an empty output file.');
              if (data.length > MAX_OUTPUT_BYTES) {
                throw new Error('The deobfuscated output is larger than the Discord attachment limit.');
              }

              const safeName = String(input.filename || 'script.lua').replaceAll(String.fromCharCode(96), '');
              await message.reply({
                content: '**DAILY DEOBF - Luraph 15.1 (new engine)**\nProcessed: ' + safeName +
                  '\n\nThe engine reconstructs code paths it can analyze. Some protected paths may remain incomplete.',
                files: [new AttachmentBuilder(data, { name: 'deobfuscated.luau' })],
                allowedMentions: { repliedUser: false },
              });
              await prompt.edit({ content: 'Luraph 15.1 finished. The deobfuscated Luau file is attached above.', components: [] });
            } finally {
              await fs.rm(tempRoot, { recursive: true, force: true }).catch(() => {});
            }
          }'''
          app = app[:start] + replacement + app[end:]
          index_path.write_text(app, encoding="utf-8")

          # Replace the old 15.1 base64 unpacker with a non-destructive validator.
          setup = r"""'use strict';

          const fs = require('node:fs');
          const path = require('node:path');

          const root = path.resolve(__dirname, '..');
          const engines = [
            { label: 'Luraph v15', directory: 'luraph-v15-engine' },
            { label: 'Luraph 15.1', directory: 'luraph-v15.1-engine' },
          ];

          for (const engine of engines) {
            const base = path.join(root, engine.directory);
            const required = [
              'deob.js',
              'src/detect.js',
              'src/driver.js',
              'src/harness.js',
              'core/obfuscators/luraph_v15/__init__.py',
              'runtime/envlog.luau',
              'bin/luau',
              'bin/luau-ast',
            ];
            for (const relative of required) {
              const fullPath = path.join(base, relative);
              if (!fs.existsSync(fullPath) || !fs.statSync(fullPath).isFile()) {
                throw new Error(engine.label + ' engine is missing ' + relative);
              }
            }
            if (process.platform !== 'win32') {
              fs.chmodSync(path.join(base, 'bin/luau'), 0o755);
              fs.chmodSync(path.join(base, 'bin/luau-ast'), 0o755);
            }
          }

          console.log('Validated independent Luraph v15 and 15.1 engines.');"""
          (root / "scripts/setup-engines.js").write_text(setup, encoding="utf-8")

          package_path = root / "package.json"
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package.setdefault("scripts", {})["check"] = (
              "node --check index.js && "
              "node --check luraph-v15-engine/deob.js && "
              "node --check luraph-v15.1-engine/deob.js && "
              "node --check scripts/setup-engines.js"
          )
          package.get("dependencies", {}).pop("adm-zip", None)
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")

          for name in (
              "upload/INSPECT_LURAPH151_TRIGGER.txt",
              "upload/INSPECT_NESTED_RAR_TRIGGER.txt",
              "upload/INSPECT_SOURCE_TRIGGER.txt",
              "upload/IMPORT_151_TRIGGER.txt",
              ".github/workflows/inspect-luraph151.yml",
          ):
              path = root / name
              if path.is_file():
                  path.unlink()

          vendor = root / "vendor"
          if vendor.exists():
              shutil.rmtree(vendor)
          PY

      - name: Verify both engines and application
        run: |
          set -euo pipefail
          node --check index.js
          node --check luraph-v15-engine/deob.js
          node --check luraph-v15.1-engine/deob.js
          node --check scripts/setup-engines.js
          node scripts/setup-engines.js
          npm run check

      - name: Commit integrated 15.1 engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install separate Luraph 15.1 engine"
          git push
