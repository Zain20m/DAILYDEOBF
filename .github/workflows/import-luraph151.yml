name: Replace Luraph 15.1 engine from newest upload

on:
  push:
    paths:
      - "upload/Luraph_v15_1_Deobfuscator_Newest.zip"
      - "upload/IMPORT_151_TRIGGER.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unwrap ZIP and import the replacement engine
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y 7zip
          SEVEN="$(command -v 7zz || command -v 7z)"
          export SEVEN
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import os
          import shutil
          import subprocess
          import tempfile

          root = Path.cwd()
          wrapper = root / "upload/Luraph_v15_1_Deobfuscator_Newest.zip"
          if not wrapper.is_file():
              raise SystemExit(f"Missing uploaded archive: {wrapper}")

          with ZipFile(wrapper) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC check failed: {bad}")
              files = [entry for entry in z.infolist() if not entry.is_dir()]
              if len(files) != 1 or not files[0].filename.lower().endswith(".rar"):
                  raise SystemExit("Expected the uploaded ZIP to contain exactly one RAR file.")
              rar_bytes = z.read(files[0])

          seven = os.environ["SEVEN"]
          destination = root / "luraph-v15.1-engine"

          with tempfile.TemporaryDirectory(prefix="daily-deobf-151-") as temp:
              temp_root = Path(temp)
              rar = temp_root / "payload.rar"
              extracted = temp_root / "rar"
              extracted.mkdir()
              rar.write_bytes(rar_bytes)

              subprocess.run([seven, "t", str(rar)], check=True, capture_output=True, text=True)
              listing = subprocess.run(
                  [seven, "l", "-slt", str(rar)],
                  check=True, capture_output=True, text=True
              ).stdout

              records, current = [], {}
              for line in listing.split("----------", 1)[-1].splitlines():
                  if not line.strip():
                      if current:
                          records.append(current)
                          current = {}
                  elif " = " in line:
                      key, value = line.split(" = ", 1)
                      current[key] = value
              if current:
                  records.append(current)

              total = 0
              entry_count = 0
              for record in records:
                  name = record.get("Path", "")
                  if not name or name == str(rar):
                      continue
                  safe_path = PurePosixPath(name.replace("\\", "/"))
                  if safe_path.is_absolute() or ".." in safe_path.parts:
                      raise SystemExit(f"Unsafe RAR path: {name}")
                  if "Symbolic Link" in record.get("Attributes", ""):
                      raise SystemExit(f"Symlink entry is not allowed: {name}")
                  if record.get("Folder") != "+":
                      total += int(record.get("Size", "0") or 0)
                  entry_count += 1

              if entry_count > 5000 or total > 256 * 1024 * 1024:
                  raise SystemExit(f"RAR exceeds extraction limits: {entry_count} entries, {total} bytes")

              subprocess.run(
                  [seven, "x", "-y", f"-o{extracted}", str(rar)],
                  check=True, capture_output=True, text=True
              )

              source = extracted / "v15_tool_attempt_source"
              required = [
                  "deob.js",
                  "package.json",
                  "protocol.json",
                  "src/detect.js",
                  "src/driver.js",
                  "src/harness.js",
                  "src/vmmap.js",
                  "src/pyenv.js",
                  "src/devirt_bridge.py",
                  "core/obfuscators/luraph_v15/__init__.py",
                  "runtime/envlog.luau",
                  "runtime/roblox_api.luau",
                  "runtime/datatypes.luau",
                  "runtime/unicode_data.luau",
                  "bin/luau",
                  "bin/luau-ast",
              ]
              missing = [name for name in required if not (source / name).is_file()]
              if missing:
                  raise SystemExit("Archive is missing required engine files: " + ", ".join(missing))

              if destination.exists():
                  shutil.rmtree(destination)
              shutil.copytree(
                  source,
                  destination,
                  ignore=shutil.ignore_patterns(
                      "__pycache__", "*.pyc", "*.exe",
                      "samples_v15.1_deobfuscated", ".DS_Store"
                  ),
              )
              for binary in (destination / "bin/luau", destination / "bin/luau-ast"):
                  binary.chmod(0o755)

              for js in destination.rglob("*.js"):
                  subprocess.run(
                      ["node", "--check", str(js)],
                      check=True, capture_output=True, text=True
                  )
              for py in destination.rglob("*.py"):
                  if "__pycache__" not in py.parts:
                      compile(py.read_text(encoding="utf-8"), str(py), "exec")

              sample = source / "samples_v15.1_deobfuscated/2153b779fa7a87f2_obfuscated.lua"
              if not sample.is_file():
                  raise SystemExit("Expected bundled 15.1 sample input is missing.")

              detection = subprocess.run(
                  ["node", str(destination / "deob.js"), str(sample), "--detect"],
                  cwd=destination,
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=30,
              )
              print("15.1 SAMPLE DETECTION:")
              print(detection.stdout.strip())
              if "luraph_v15" not in detection.stdout:
                  raise SystemExit("The new engine did not recognize its bundled Luraph 15.1 sample.")

              output = temp_root / "deobfuscated-sample.luau"
              result = subprocess.run(
                  [
                      "node", str(destination / "deob.js"), str(sample),
                      "-o", str(output),
                      "--plugin", "luraph_v15",
                      "--budget", "30",
                      "--timeout", "120",
                  ],
                  cwd=destination,
                  capture_output=True,
                  text=True,
                  timeout=420,
              )
              if result.returncode != 0 or not output.is_file() or output.stat().st_size == 0:
                  print("ENGINE STDOUT:")
                  print(result.stdout[-6000:])
                  print("ENGINE STDERR:")
                  print(result.stderr[-12000:])
                  raise SystemExit("The new engine failed its bundled Luraph 15.1 sample.")
              print(f"15.1 SAMPLE TEST PASSED: {output.stat().st_size} output bytes")

          print("IMPORTED_REPLACEMENT_ENGINE_OK")
          PY

      - name: Verify current Discord integration was preserved
        shell: bash
        run: |
          set -euo pipefail
          node --check index.js
          node --check luraph-v15.1-engine/deob.js
          node --check luraph-v15.1-engine/src/detect.js
          node --check luraph-v15.1-engine/src/driver.js
          node --check luraph-v15.1-engine/src/harness.js
          python3 - <<'PY'
          from pathlib import Path
          app = Path("index.js").read_text(encoding="utf-8")
          setup = Path("scripts/setup-engines.js").read_text(encoding="utf-8")
          required_app = (
              "const ENGINE_151_CLI = path.join(ENGINE_151_DIR, 'deob.js');",
              "async function processLuraph151(",
              "ENGINE_151_CLI,",
              "'--plugin', 'luraph_v15'",
          )
          missing = [item for item in required_app if item not in app]
          if missing:
              raise SystemExit("Current Discord integration is missing: " + ", ".join(missing))
          if "'luraph-v15.1-engine'" not in setup or "'deob.js'" not in setup:
              raise SystemExit("Engine setup validation no longer includes the v15.1 engine.")
          print("CURRENT_151_DISCORD_INTEGRATION_OK")
          PY

      - name: Commit only the replacement engine files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- luraph-v15.1-engine
          if git diff --cached --quiet; then
            echo 'Imported engine is identical; no replacement changes to commit.'
            exit 0
          fi
          git commit -m 'Replace Luraph 15.1 engine with newest archive'
          git push
