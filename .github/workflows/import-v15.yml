name: Inspect Luraph 15.1 upload

on:
  push:
    paths:
      - "upload/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-151:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Inspect archive only (no project code is executed)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile

          archive = Path("upload/Luraph_v15_1_Deobfuscator_Newest.zip")
          if not archive.is_file():
              raise SystemExit(f"Missing archive: {archive}")
          print(f"ARCHIVE {archive} {archive.stat().st_size} bytes")
          try:
              with ZipFile(archive) as z:
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f"ZIP CRC failed: {bad}")
                  infos = [i for i in z.infolist() if not i.is_dir()]
                  print(f"ZIP_OK files={len(infos)} uncompressed={sum(i.file_size for i in infos)} bytes")
                  for i in infos:
                      print(f"FILE {i.file_size:>10} {i.filename}")
                  print("\n--- README and dependency manifests ---")
                  selected = 0
                  for i in infos:
                      base = i.filename.replace("\\", "/").rsplit("/", 1)[-1].lower()
                      if base.startswith("readme") or base in {
                          "requirements.txt", "pyproject.toml", "package.json",
                          "setup.py", "setup.cfg", "cmakelists.txt", "makefile"
                      }:
                          if i.file_size > 40000:
                              print(f"SKIP {i.filename}: {i.file_size} bytes")
                              continue
                          try:
                              doc = z.read(i).decode("utf-8", "replace")
                          except Exception as exc:
                              print(f"READ_ERROR {i.filename}: {exc}")
                              continue
                          print(f"\n### {i.filename}\n{doc[:7000]}")
                          selected += 1
                          if selected >= 10:
                              break
          except BadZipFile as exc:
              raise SystemExit(f"Invalid ZIP: {exc}")
          PY
