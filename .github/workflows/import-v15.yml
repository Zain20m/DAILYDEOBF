name: Import newest Luraph v15 engine

on:
  push:
    paths:
      - "upload/DAILY-DEOBF-LURAPH-V15-NEWEST.zip"

permissions:
  contents: write

jobs:
  import-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract and install newest engine
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="upload/DAILY-DEOBF-LURAPH-V15-NEWEST.zip"
          test -f "$ARCHIVE"

          rm -rf /tmp/daily-deobf-import
          mkdir -p /tmp/daily-deobf-import
          unzip -q "$ARCHIVE" -d /tmp/daily-deobf-import
          test -f /tmp/daily-deobf-import/luraph-v15-engine/deob.js
          test -f /tmp/daily-deobf-import/luraph-v15-engine/bin/luau
          test -f /tmp/daily-deobf-import/luraph-v15-engine/bin/luau-ast

          rm -rf luraph-v15-engine
          cp -R /tmp/daily-deobf-import/luraph-v15-engine ./luraph-v15-engine
          chmod +x luraph-v15-engine/bin/luau luraph-v15-engine/bin/luau-ast
          python3 scripts/apply-luraph-newest.py
          rm -f "$ARCHIVE"

          node --check index.js
          node --check luraph-v15-engine/deob.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace legacy 15.1 engine with newest Luraph v15"
          git push
