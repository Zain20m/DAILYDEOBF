name: Inspect uploaded IronBrew 2 archive
on:
  push:
    paths:
      - '.github/workflows/inspect-ib2-upload.yml'
      - 'upload/ib2-deobf.zip'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect archive without executing it
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          archive = pathlib.Path("upload/ib2-deobf.zip")
          out = pathlib.Path("ib2-inspection.txt")
          total = 0
          with zipfile.ZipFile(archive) as z:
              rows = sorted(z.infolist(), key=lambda x: x.filename.lower())
              with out.open("w", encoding="utf-8") as f:
                  f.write(f"ARCHIVE: {archive.name}\\nENTRIES: {len(rows)}\\n")
                  for item in rows:
                      f.write(f"{item.filename} | size={item.file_size} | compressed={item.compress_size}\\n")
                  f.write("\\n===== TEXT SOURCES =====\\n")
                  for item in rows:
                      name = item.filename.lower()
                      if item.is_dir() or not name.endswith((".md", ".txt", ".cs", ".csproj", ".sln", ".json", ".yml", ".yaml", ".py", ".xml")):
                          continue
                      if item.file_size > 120000 or total + item.file_size > 600000:
                          f.write(f"\\n[SKIPPED SIZE LIMIT] {item.filename} ({item.file_size} bytes)\\n")
                          continue
                      try:
                          data = z.read(item)
                          text = data.decode("utf-8", "replace")
                      except Exception as e:
                          f.write(f"\\n[READ ERROR] {item.filename}: {e}\\n")
                          continue
                      f.write(f"\\n===== {item.filename} =====\\n")
                      f.write(text)
                      f.write("\\n")
                      total += len(data)
          print(out.read_text(encoding="utf-8")[:12000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ib2-inspection
          path: ib2-inspection.txt
          retention-days: 1
