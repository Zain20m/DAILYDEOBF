name: Inspect bundled Luraph 15.1 archive

on:
  push:
    paths:
      - '.github/workflows/inspect-luraph151-zip.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ZIP layout
        shell: bash
        run: |
          set -euo pipefail
          ZIP="upload/Luraph-v15.1-Deobfuscator-main.zip"
          REPORT="upload/Luraph-v15.1-Deobfuscator-main.ZIP-INSPECTION.txt"
          test -s "$ZIP"
          {
            echo "Archive: $ZIP"
            echo
            echo "=== ZIP entries (first 300) ==="
            unzip -Z1 "$ZIP" | sed -n '1,300p'
            echo
            echo "=== Relevant project files ==="
            unzip -Z1 "$ZIP" | grep -Ei '(^|/)(deob\\.js|index\\.js|package\\.json|README[^/]*|requirements[^/]*|main\\.py|setup\\.py)$' | sed -n '1,120p' || true
            echo
            echo "=== Root-level entries ==="
            unzip -Z1 "$ZIP" | awk -F/ 'NF { print $1 }' | sort -u
          } > "$REPORT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          git commit -m "Inspect bundled Luraph 15.1 archive layout"
          git push
