name: Restore complete Luraph 15.1 package modules

on:
  push:
    paths:
      - '.github/workflows/inspect-new-luraph-upload.yml'

permissions:
  contents: write

jobs:
  restore-package-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the archive's bundled v14 compatibility module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/luraph-archive
          unzip -q 'upload/Luraph-v15.1-Deobfuscator-main.zip' -d /tmp/luraph-archive
          SRC=/tmp/luraph-archive/Luraph-v15.1-Deobfuscator-main
          test -f "$SRC/core/obfuscators/luraph_v14/__init__.py"
          test -f "$SRC/core/obfuscators/luraph_v14/driver.py"
          test -f "$SRC/core/obfuscators/luraph_v14/vmmap.py"
          test -f "$SRC/core/obfuscators/luraph_v14/devirt.py"
          mkdir -p luraph-v15.1-engine/core/obfuscators
          rm -rf luraph-v15.1-engine/core/obfuscators/luraph_v14
          cp -a "$SRC/core/obfuscators/luraph_v14" luraph-v15.1-engine/core/obfuscators/
          python3 - <<'PY'
          from pathlib import Path
          module = Path("luraph-v15.1-engine/core/obfuscators/luraph_v14")
          required = ("__init__.py", "driver.py", "vmmap.py", "devirt.py")
          missing = [name for name in required if not (module / name).is_file()]
          if missing:
              raise SystemExit("Restored compatibility module is incomplete: " + ", ".join(missing))
          for path in module.glob("*.py"):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          print("RESTORED_V15_ARCHIVE_COMPATIBILITY_MODULE_OK")
          PY

      - name: Commit restored package files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add luraph-v15.1-engine/core/obfuscators/luraph_v14
          if git diff --cached --quiet; then
            echo 'Compatibility module is already present'
            exit 0
          fi
          git commit -m 'Restore complete v15.1 archive compatibility module'
          git push
