name: Inspect Universal Loader Toolkit
on:
  push:
    paths:
      - '.github/workflows/inspect-universal-loader-toolkit.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract toolkit
        run: |
          mkdir -p /tmp/toolkit
          unzip -q "upload/UniversalLoaderToolkit (1).zip" -d /tmp/toolkit
          find /tmp/toolkit -type f -maxdepth 5 -print
      - uses: actions/upload-artifact@v4
        with:
          name: universal-loader-toolkit-source
          path: /tmp/toolkit/
