name: Inspect UnveilR DLL safely
on:
  push:
    paths:
      - '.github/workflows/inspect-unvielr-dll.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bounded archive and PE inspection
        run: |
          python - <<'PY'
          import zipfile, io, os, struct, re, hashlib
          root = "upload/UnvielR_v3.2.zip"
          out = "/tmp/unvielr-safe"
          os.makedirs(out, exist_ok=True)
          queue = [(open(root, "rb").read(), root, 0)]
          seen = set()
          report = []
          dll_index = 0
          total_nested = 0
          while queue and len(seen) < 300:
              blob, label, depth = queue.pop(0)
              digest = hashlib.sha256(blob).hexdigest()
              if digest in seen or depth > 12:
                  continue
              seen.add(digest)
              try:
                  zf = zipfile.ZipFile(io.BytesIO(blob))
              except Exception as e:
                  report.append(f"NOT_ZIP {label}: {e}")
                  continue
              report.append(f"ARCHIVE {label} bytes={len(blob)} entries={len(zf.infolist())}")
              for info in zf.infolist():
                  if info.is_dir():
                      continue
                  report.append(
                      f"ENTRY {label}!{info.filename} compressed={info.compress_size} "
                      f"uncompressed={info.file_size} method={info.compress_type} "
                      f"crc={info.CRC:08x}"
                  )
                  base = os.path.basename(info.filename).lower()
                  if base.endswith(".zip") and info.file_size <= 32 * 1024 * 1024:
                      try:
                          nested = zf.read(info)
                          total_nested += len(nested)
                          if total_nested <= 96 * 1024 * 1024:
                              queue.append((nested, label + "!" + info.filename, depth + 1))
                      except Exception as e:
                          report.append(f"NESTED_READ_ERROR {info.filename}: {e}")
                  if base == "0.dll" or base.endswith(".dll"):
                      dll_index += 1
                      try:
                          with zf.open(info, "r") as stream:
                              sample = stream.read(1024 * 1024)
                          sample_path = os.path.join(out, f"dll-{dll_index}-first-1MiB.bin")
                          open(sample_path, "wb").write(sample)
                          report.append(f"DLL_SAMPLE {sample_path} bytes={len(sample)} sha256={hashlib.sha256(sample).hexdigest()}")
                          if sample[:2] == b"MZ" and len(sample) >= 64:
                              peoff = struct.unpack_from("<I", sample, 0x3c)[0]
                              report.append(f"PE_DOS_HEADER yes pe_offset={peoff}")
                              if peoff + 24 <= len(sample) and sample[peoff:peoff+4] == b"PE\0\0":
                                  machine, sections, timestamp, symptr, symbols, optsize, chars = struct.unpack_from("<HHIIIHH", sample, peoff+4)
                                  report.append(f"PE_HEADER machine=0x{machine:04x} sections={sections} timestamp={timestamp} optional_header_size={optsize} characteristics=0x{chars:04x}")
                              else:
                                  report.append("PE_HEADER not present in first sample")
                          else:
                              report.append("PE_DOS_HEADER no MZ signature in first sample")
                          ascii_strings = re.findall(rb"[ -~]{6,}", sample)
                          wide_strings = re.findall(rb"(?:[ -~]\x00){6,}", sample)
                          strings = [x.decode("ascii", "replace") for x in ascii_strings[:500]]
                          strings += [x[::2].decode("ascii", "replace") for x in wide_strings[:300]]
                          open(os.path.join(out, f"dll-{dll_index}-strings.txt"), "w").write("\n".join(strings))
                      except Exception as e:
                          report.append(f"DLL_SAMPLE_ERROR {info.filename}: {type(e).__name__}: {e}")
          open(os.path.join(out, "inspection.txt"), "w").write("\n".join(report))
          print("\n".join(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: unvielr-dll-static-inspection
          path: /tmp/unvielr-safe/
          if-no-files-found: error
