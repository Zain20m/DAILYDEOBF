name: Inspect UnvielR v3.2 archive
on:
  push:
    paths:
      - '.github/workflows/inspect-unvielr.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recursively extract archive
        run: |
          python - <<'PY'
          import zipfile, os, io
          source = "upload/UnvielR_v3.2.zip"
          out = "/tmp/unvielr"
          os.makedirs(out, exist_ok=True)
          queue = [(open(source, "rb").read(), "root", 0)]
          seen = 0
          while queue:
              data, label, depth = queue.pop(0)
              if depth > 6:
                  continue
              try:
                  z = zipfile.ZipFile(io.BytesIO(data))
              except Exception:
                  if len(data) <= 5_000_000:
                      path = os.path.join(out, label.replace("/", "_"))
                      with open(path, "wb") as f:
                          f.write(data)
                  continue
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  name = os.path.basename(info.filename)
                  if not name:
                      continue
                  blob = z.read(info)
                  seen += 1
                  if name.lower().endswith(".zip"):
                      queue.append((blob, label + "_" + name, depth + 1))
                  elif len(blob) <= 5_000_000:
                      safe = str(seen).zfill(3) + "_" + name
                      with open(os.path.join(out, safe), "wb") as f:
                          f.write(blob)
          print("Extracted", seen, "entries")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: unvielr-v3-2-extracted
          path: /tmp/unvielr/
          if-no-files-found: error
