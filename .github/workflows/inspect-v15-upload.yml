name: Inspect Luraph v15 upload

on:
  push:
    paths:
      - "upload/INSPECT_V15_TRIGGER.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-v15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect v15 CLI, detector, driver and docs (static only)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("upload/Deobfuscator.zip")
          with ZipFile(archive) as z:
              targets = [
                  "Deobfuscator/LURAPH.md",
                  "Deobfuscator/deobf/deob.py",
                  "Deobfuscator/deobf/obfuscators/luraph_v15/__init__.py",
                  "Deobfuscator/deobf/obfuscators/luraph_v15/driver.py",
                  "Deobfuscator/deobf/obfuscators/base.py",
                  "Deobfuscator/deobf/build_luau.py",
              ]
              names = set(z.namelist())
              for name in targets:
                  if name not in names:
                      print(f"\nMISSING {name}")
                      continue
                  raw = z.read(name).decode("utf-8", "replace")
                  print(f"\n### {name} ({len(raw)} chars)\n{raw[:18000]}")
          PY
