name: Test imported Luraph v14 engines

on:
  push:
    paths:
      - "luraph-v14.7-engine/**"
      - "luraph-v14.3-engine/**"
      - "luraph-v15-engine/bin/**"
      - "index.js"
      - "scripts/setup-engines.js"
      - ".github/workflows/test-luraph-14-engines.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check Discord bot JavaScript syntax
        run: node --check index.js

      - name: Compile imported Python sources
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 - <<'PY'
          from pathlib import Path
          engines = [Path("luraph-v14.7-engine"), Path("luraph-v14.3-engine")]
          count = 0
          for engine in engines:
              for source in engine.rglob("*.py"):
                  compile(source.read_text(encoding="utf-8"), str(source), "exec")
                  count += 1
          print(f"Compiled {count} Python source files.")
          PY

      - name: Load the Luraph v14.7, v14.8 and v14.9 engines
        env:
          PYTHONPATH: luraph-v14.7-engine
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import cli
          import harness
          from obfuscators.luraph_v14_7 import driver as driver147, vmmap as map147, devirt as devirt147
          from obfuscators.luraph_v14_8 import driver as driver148, vmmap as map148, devirt as devirt148
          from obfuscators.luraph_v14_9 import driver as driver149, vmmap as map149, devirt as devirt149
          for version in ("14.7", "14.8", "14.9"):
              engine = cli.load_engine(version)
              print(f"Loaded Luraph v{version}: {type(engine).__name__}")
          spin_samples = [
              ("while true do local opcode=ops[pc]\nend", "do"),
              ("while  true  do\n  if ready then step() end\nend", "do"),
              ("while running and ready\n do work() end", "do"),
              ("while true do helper() end", "do"),
              ("repeat\n  work()\nuntil done", "repeat"),
              ("for i = 1, 10 do work(i) end", "do"),
              ("for key, value in pairs(items) do work(key, value) end", "do"),
          ]
          marker = "__SPIN.n=__SPIN.n+1;"
          for sample, delimiter in spin_samples:
              patched = driver149.patch_spin(sample)
              assert marker in patched, sample
              assert patched.count(marker) == 1, sample
              assert delimiter + "\n" + marker in patched, sample
          envlog = Path("luraph-v14.7-engine/envlog.luau").read_text(encoding="utf-8")
          assert 'R.gsub(patched, "while%s+.-%s+do"' in envlog
          assert 'R.gsub(patched, "for%s+.-%s+do"' in envlog
          assert 'R.gsub(patched, "repeat%s+"' in envlog
          print("Luraph v14.9 watchdog covers while, repeat, for, and dynamic chunks.")
          import tempfile
          import os
          parser = map149.luau_ast_executable()
          runtime = harness.find_luau()
          import subprocess
          runtime_check = subprocess.run([runtime, "-e", "print('luau-runtime-ok')"], capture_output=True, text=True, timeout=15)
          assert runtime_check.returncode == 0 and "luau-runtime-ok" in runtime_check.stdout, runtime_check.stderr
          print(f"Luraph v14 runtime resolved and ran: {runtime}")
          spin_test = r"""
          local marker = "__SPIN.n=__SPIN.n+1;"
          local function instrument(source)
            source = string.gsub(source, "while%s+.-%s+do", "%0\n" .. marker)
            source = string.gsub(source, "for%s+.-%s+do", "%0\n" .. marker)
            source = string.gsub(source, "repeat%s+", "%0\n" .. marker)
            return source
          end
          local samples = {
            "while true do work() end",
            "while running\n and ready do work() end",
            "repeat work() until done",
            "for i = 1, 10 do work(i) end",
            "for key, value in pairs(items) do work(key, value) end"
          }
          for _, source in ipairs(samples) do
            local patched = instrument(source)
            assert(string.find(patched, marker, 1, true), source)
          end
          print("dynamic loadstring spin watchdog patterns passed")
          """
          spin_result = subprocess.run([runtime, "-e", spin_test], capture_output=True, text=True, timeout=15)
          assert spin_result.returncode == 0 and "dynamic loadstring spin watchdog patterns passed" in spin_result.stdout, spin_result.stderr
          with tempfile.NamedTemporaryFile("w", suffix=".luau", delete=False) as sample:
              sample.write("return 1\n")
              sample_path = sample.name
          try:
              assert map149.load_ast(sample_path), "luau-ast returned an empty AST"
          finally:
              os.unlink(sample_path)
          print(f"Luraph v14.9 AST parser resolved and ran: {parser}")
          print("All three VM drivers, mappers and devirtualizers imported.")

          # Regression tests for the failures recorded in Luraph149_report.txt.
          from ir import Missing, Bin, Const, Reg
          import luasym as S

          class ProbeLifter:
              special = {}
              def sym_binop(self, op, left, right):
                  return (op, left, right)

          probe = ProbeLifter()
          interp = S.Interp(probe)
          missing_local = interp.getvar(S.Scope(), {"location": "1,2", "name": "captured"})
          assert isinstance(missing_local, Missing), missing_local

          symbolic_arithmetic = interp.binop("Add", None, 7)
          assert symbolic_arithmetic[0] == "Add"
          assert isinstance(symbolic_arithmetic[1], Missing), symbolic_arithmetic
          assert symbolic_arithmetic[2] == 7, symbolic_arithmetic

          try:
              interp.exec_stmt({
                  "type": "AstStatFor",
                  "from": {"type": "AstExprConstantNil"},
                  "to": {"type": "AstExprConstantNumber", "value": 10},
                  "step": None,
                  "var": {"location": "3,4", "name": "i"},
                  "body": {"body": []},
              }, S.Scope())
          except S.Unsupported as exc:
              assert "unresolved nil bounds" in str(exc), exc
          else:
              raise AssertionError("unresolved numeric-for bounds were silently skipped")

          lifter = object.__new__(devirt149.ProtoLifter)
          lifter.stack_base = 100
          lifter.jump_regs = set()
          lifter.need_jump_regs = set()
          lifter._need_jreg(Bin("Add", Reg(101), Const(1)))
          assert lifter.need_jump_regs == {101}, lifter.need_jump_regs

          # First-pass regression: the stack base must be known before a
          # handler's symbolic numeric-for raises, not only after carry analysis.
          from types import SimpleNamespace
          first_pass = object.__new__(devirt149.Stepper)
          first_pass.vm = SimpleNamespace(_sp_cands={}, inner_body=[])
          first_pass.loops = [(0, None, {
              "type": "AstStatWhile",
              "body": {"body": [
                  {
                      "type": "AstStatExpr",
                      "expr": {
                          "type": "AstExprIndexExpr",
                          "expr": {"type": "AstExprLocal", "local": {"location": "regs"}},
                          "index": {"type": "AstExprLocal", "local": {"location": "top"}},
                      },
                  },
                  {
                      "type": "AstStatExpr",
                      "expr": {
                          "type": "AstExprIndexExpr",
                          "expr": {"type": "AstExprLocal", "local": {"location": "regs"}},
                          "index": {"type": "AstExprLocal", "local": {"location": "idx"}},
                      },
                  },
                  {
                      "type": "AstStatCompoundAssign",
                      "var": {"type": "AstExprLocal", "local": {"location": "top"}},
                  },
              ]},
          })]
          first_pass.lf = SimpleNamespace(out=[], stack_base=None)
          first_pass._fresh_scopes = lambda state, interp: (
              None, SimpleNamespace(vars={"regs": S.RegFile(), "top": 16, "idx": 2})
          )
          assert first_pass._stack_pointer_candidates() == {"top", "idx"}
          assert first_pass.lf.stack_base == 16, first_pass.lf.stack_base
          probe149 = object.__new__(devirt149.ProtoLifter)
          probe149.stack_base = first_pass.lf.stack_base
          probe149.jump_regs = set()
          probe149.need_jump_regs = set()
          probe149._need_jreg(Bin("Add", Reg(17), Const(1)))
          assert probe149.need_jump_regs == {17}, probe149.need_jump_regs

          # The opaque runtime-factory path must register the same captures
          # as make_closure(), or constant propagation can keep stale facts.
          for module in (devirt147, devirt148, devirt149):
              factory_lifter = object.__new__(module.ProtoLifter)
              factory_lifter.vm = SimpleNamespace()
              factory_lifter.dump = SimpleNamespace(pid_of_table={77: 1})
              factory_lifter.children = []
              factory_lifter.captured_regs = set()
              child_proto = S.LTable(tid=77)
              frame_descriptor = S.LTable({1: S.RegFile(), 2: 21})
              child_upvals = S.LTable({1: module.MaybeBox(14), 2: frame_descriptor})
              child_result = factory_lifter.call_symbolic(
                  module.OpaqueFn(900), S.Multi([child_proto, child_upvals]), None, False
              )
              child = child_result.first()
              assert isinstance(child, module.ClosureExpr), child
              assert child.upvals[0].reg == 14, child.upvals
              assert child.upvals[1] is frame_descriptor, child.upvals
              assert factory_lifter.captured_regs == {14, 21}, factory_lifter.captured_regs
              assert factory_lifter.children == [child], factory_lifter.children

          assert 'allow_partial = os.environ.get("DEVIRT_ALLOW_PARTIAL") == "1"' in Path(
              "luraph-v14.7-engine/obfuscators/luraph_v14_9/devirt.py"
          ).read_text(encoding="utf-8")
          print("Luraph v14 symbolic-state regression checks passed.")
          PY
          python3 luraph-v14.7-engine/cli.py --help >/dev/null
          echo "Shared v14.7-v14.9 CLI help check passed."

      - name: Run the Luraph v14.3 bundled sample through the adapter
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 luraph-v14.3-engine/daily_cli.py \
            luraph-v14.3-engine/samples/sunjingwoo.lua \
            --output /tmp/Luraph143_static_report.txt \
            --max-report-mb 3
          test -s /tmp/Luraph143_static_report.txt
          test -s /tmp/Luraph143_static_report.txt.decoded.bin
          echo "Report preview:"
          head -n 18 /tmp/Luraph143_static_report.txt
          echo "Luraph v14.3 decoder/adapter smoke test passed."
