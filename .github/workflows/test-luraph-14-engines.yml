name: Test imported Luraph v14 engines

on:
  push:
    paths:
      - "luraph-v14.7-engine/**"
      - "luraph-v14.3-engine/**"
      - "luraph-v15-engine/bin/**"
      - "index.js"
      - "scripts/setup-engines.js"
      - ".github/workflows/test-luraph-14-engines.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check Discord bot JavaScript syntax
        run: node --check index.js

      - name: Compile imported Python sources
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 - <<'PY'
          from pathlib import Path
          engines = [Path("luraph-v14.7-engine"), Path("luraph-v14.3-engine")]
          count = 0
          for engine in engines:
              for source in engine.rglob("*.py"):
                  compile(source.read_text(encoding="utf-8"), str(source), "exec")
                  count += 1
          print(f"Compiled {count} Python source files.")
          PY

      - name: Load the Luraph v14.7, v14.8 and v14.9 engines
        env:
          PYTHONPATH: luraph-v14.7-engine
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import cli
          import harness
          from obfuscators.luraph_v14_7 import driver as driver147, vmmap as map147, devirt as devirt147
          from obfuscators.luraph_v14_8 import driver as driver148, vmmap as map148, devirt as devirt148
          from obfuscators.luraph_v14_9 import driver as driver149, vmmap as map149, devirt as devirt149
          for version in ("14.7", "14.8", "14.9"):
              engine = cli.load_engine(version)
              print(f"Loaded Luraph v{version}: {type(engine).__name__}")
          spin_samples = [
              ("while true do local opcode=ops[pc]\nend", "do"),
              ("while  true  do\n  if ready then step() end\nend", "do"),
              ("while running and ready\n do work() end", "do"),
              ("while true do helper() end", "do"),
              ("repeat\n  work()\nuntil done", "repeat"),
              ("for i = 1, 10 do work(i) end", "do"),
              ("for key, value in pairs(items) do work(key, value) end", "do"),
          ]
          marker = "__SPIN.n=__SPIN.n+1;"
          for sample, delimiter in spin_samples:
              patched = driver149.patch_spin(sample)
              assert marker in patched, sample
              assert patched.count(marker) == 1, sample
              assert delimiter + "\n" + marker in patched, sample
          envlog = Path("luraph-v14.7-engine/envlog.luau").read_text(encoding="utf-8")
          assert 'R.gsub(patched, "while%s+.-%s+do"' in envlog
          assert 'R.gsub(patched, "for%s+.-%s+do"' in envlog
          assert 'R.gsub(patched, "repeat%s+"' in envlog
          print("Luraph v14.9 watchdog covers while, repeat, for, and dynamic chunks.")
          import tempfile
          import os
          parser = map149.luau_ast_executable()
          runtime = harness.find_luau()
          import subprocess
          runtime_check = subprocess.run([runtime, "-e", "print('luau-runtime-ok')"], capture_output=True, text=True, timeout=15)
          assert runtime_check.returncode == 0 and "luau-runtime-ok" in runtime_check.stdout, runtime_check.stderr
          print(f"Luraph v14 runtime resolved and ran: {runtime}")
          spin_test = r"""
          local marker = "__SPIN.n=__SPIN.n+1;"
          local function instrument(source)
            source = string.gsub(source, "while%s+.-%s+do", "%0\n" .. marker)
            source = string.gsub(source, "for%s+.-%s+do", "%0\n" .. marker)
            source = string.gsub(source, "repeat%s+", "%0\n" .. marker)
            return source
          end
          local samples = {
            "while true do work() end",
            "while running\n and ready do work() end",
            "repeat work() until done",
            "for i = 1, 10 do work(i) end",
            "for key, value in pairs(items) do work(key, value) end"
          }
          for _, source in ipairs(samples) do
            local patched = instrument(source)
            assert(string.find(patched, marker, 1, true), source)
          end
          print("dynamic loadstring spin watchdog patterns passed")
          """
          spin_result = subprocess.run([runtime, "-e", spin_test], capture_output=True, text=True, timeout=15)
          assert spin_result.returncode == 0 and "dynamic loadstring spin watchdog patterns passed" in spin_result.stdout, spin_result.stderr
          with tempfile.NamedTemporaryFile("w", suffix=".luau", delete=False) as sample:
              sample.write("return 1\\n")
              sample_path = sample.name
          try:
              assert map149.load_ast(sample_path), "luau-ast returned an empty AST"
          finally:
              os.unlink(sample_path)
          print(f"Luraph v14.9 AST parser resolved and ran: {parser}")
          print("All three VM drivers, mappers and devirtualizers imported.")
          PY
          python3 luraph-v14.7-engine/cli.py --help >/dev/null
          echo "Shared v14.7-v14.9 CLI help check passed."

      - name: Run the Luraph v14.3 bundled sample through the adapter
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 luraph-v14.3-engine/daily_cli.py \
            luraph-v14.3-engine/samples/sunjingwoo.lua \
            --output /tmp/Luraph143_static_report.txt \
            --max-report-mb 3
          test -s /tmp/Luraph143_static_report.txt
          test -s /tmp/Luraph143_static_report.txt.decoded.bin
          echo "Report preview:"
          head -n 18 /tmp/Luraph143_static_report.txt
          echo "Luraph v14.3 decoder/adapter smoke test passed."
