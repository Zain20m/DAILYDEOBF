name: Verify DAILY DEOBF analysis engines

on:
  push:
    paths:
      - "index.js"
      - "package.json"
      - "scripts/idx-resolver.js"
      - "scripts/test-idx-output.js"
      - "scripts/idx-output.js"
      - "scripts/test-idx-resolver.js"
      - "scripts/roblox-execution.js"
      - "scripts/test-roblox-execution.js"
      - "docs/roblox-open-cloud-exec.md"
      - "pureluau.js"
      - "scripts/test-pureluau.js"
      - "scripts/automatic-pureluau.js"
      - "scripts/test-automatic-pureluau.js"
      - "scripts/flowauth-version.js"
      - "scripts/test-flowauth-version.js"
      - "scripts/deep-reconstruction-prompt.txt"
      - "scripts/setup-engines.js"
      - "scripts/test-151-loadstring-capture.py"
      - "scripts/test-v15-readable-output.py"
      - "luraph-v15-engine/**"
      - "luraph-v15.1-engine/**"
      - "centurion-engine/**"
      - ".github/workflows/verify-full-analysis.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify Node and Python source
        shell: bash
        run: |
          set -euo pipefail
          node --version
          python3 --version
          npm install --no-audit --no-fund
          npm run check
          python3 luraph-v15-engine/build_luau.py --portable
          python3 luraph-v15.1-engine/build_luau.py --portable --jobs 2
          node scripts/setup-engines.js
          python3 - <<'PY'
          from pathlib import Path
          for engine in (Path("luraph-v15-engine"), Path("luraph-v15.1-engine"), Path("centurion-engine")):
              files = list(engine.rglob("*.py"))
              for path in files:
                  if "__pycache__" not in path.parts:
                      compile(path.read_text(encoding="utf-8"), str(path), "exec")
              print(f"PYTHON_SYNTAX_OK: {engine} ({len(files)} source files)")
          PY
          python3 -m unittest discover -s luraph-v15-engine -p 'test_detection.py' -v
          python3 scripts/test-v15-readable-output.py
          python3 - <<'PY'
          from pathlib import Path
          compat = Path("luraph-v15.1-engine/core/obfuscators/luraph_v14")
          required = ("__init__.py", "driver.py", "vmmap.py", "devirt.py")
          missing = [name for name in required if not (compat / name).is_file()]
          if missing:
              raise SystemExit("Imported v15.1 package is missing bundled compatibility modules: " + ", ".join(missing))
          print("V15_ARCHIVE_COMPAT_MODULE_OK: all bundled files are present")
          PY
          python3 -m unittest discover -s centurion-engine -p 'test_*.py' -v
          python3 scripts/test-151-loadstring-capture.py
          python3 luraph-v15-engine/obfuscators/ironbrew1/test_smoothdamp.py

      - name: Verify integrated 15.1 full-lift output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          import subprocess
          import sys

          archive = Path("upload/Luraph-v15.1-Deobfuscator-main.zip")
          if not archive.is_file():
              raise SystemExit("Missing newest uploaded Luraph v15.1 archive")
          with ZipFile(archive) as z:
              names = set(z.namelist())
              root = "Luraph-v15.1-Deobfuscator-main/"
              required = [
                  "core/obfuscators/luraph_v15/driver.py",
                  "core/obfuscators/luraph_v15/devirt.py",
                  "src/driver.js",
                  "src/harness.js",
                  "src/parallel.js",
                  "runtime/envlog.luau",
                  "runtime/roblox_api.luau",
                  "deob.js",
                  "protocol.json",
                  "build_luau.py",
              ]
              missing = [name for name in required if root + name not in names]
              if missing:
                  raise SystemExit("Newest archive is missing: " + ", ".join(missing))

              # Audit every runtime/source module from the archive, not just a
              # hand-picked list. DailyDeobf intentionally applies documented integration patches
              # and rebuilds portable binaries for the host CPU.
              prefixes = ("core/", "src/", "runtime/", "bin/", "test/")
              patched = {
                  "src/detect.js", "src/tidy.js", "src/harness.js",
                  "src/driver.js", "src/parallel.js", "runtime/envlog.luau",
                  "core/obfuscators/luraph_v15/driver.py",
              }
              rebuilt = {
                  "bin/luau", "bin/luau-ast", "bin/luau.exe", "bin/luau-ast.exe",
              }
              absent = []
              different = []
              for entry in names:
                  if not entry.startswith(root):
                      continue
                  rel = entry[len(root):]
                  if not rel.startswith(prefixes) or rel.endswith("/"):
                      continue
                  if "__pycache__" in rel.split("/") or rel.endswith((".pyc", ".pyo")):
                      continue
                  target = Path("luraph-v15.1-engine") / rel
                  if not target.is_file():
                      absent.append(rel)
                  elif rel not in patched and rel not in rebuilt:
                      if target.read_bytes() != z.read(entry):
                          different.append(rel)
              for rel in ("LICENSE", "deob.js", "protocol.json",
                          "build_luau.py", "README.md", "TECHNICAL.md"):
                  entry = root + rel
                  target = Path("luraph-v15.1-engine") / rel
                  if entry in names and not target.is_file():
                      absent.append(rel)
                  elif entry in names and target.is_file() and target.read_bytes() != z.read(entry):
                      different.append(rel)
              if absent or different:
                  raise SystemExit("Archive audit failed; missing=" + repr(absent) +
                                   "; unexpected differences=" + repr(different))
              import json
              engine_package = json.loads(Path("luraph-v15.1-engine/package.json").read_text(encoding="utf-8"))
              if engine_package.get("main") != "deob.js" or engine_package.get("type") != "commonjs":
                  raise SystemExit("Integrated engine package metadata is not configured for its CLI")
              print("ARCHIVE AUDIT OK: all core/src/runtime/bin/test files present; only documented integration patches, portable binaries and local CLI package metadata differ")

              engine_root = Path("luraph-v15.1-engine")
              sample_prefix = root + "samples_v15.1_deobfuscated/"
              sample_inputs = sorted(
                  name for name in names
                  if name.startswith(sample_prefix) and name.endswith("_obfuscated.lua")
              )
              runner_entry = root + "tests/run_samples.py"
              if not sample_inputs:
                  raise SystemExit("No bundled v15.1 regression inputs were found")
              if runner_entry not in names:
                  raise SystemExit("The upstream v15.1 sample regression runner is missing")

              # Use the archive's complete public sample suite against the
              # integrated engine tree, not just one hand-picked fixture.
              for entry in names:
                  if (entry == runner_entry or entry.startswith(sample_prefix)) and not entry.endswith("/"):
                      relative = entry[len(root):]
                      target = engine_root / relative
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(entry))

              env = os.environ.copy()
              env.pop("DEOB_FAST", None)
              env["DEOB_PY_CANDIDATES"] = "python:1,python:2,python:3"
              print("Running all %d bundled v15.1 regression inputs" % len(sample_inputs))
              result = subprocess.run(
                  [sys.executable, "tests/run_samples.py"],
                  cwd=engine_root,
                  env=env,
                  capture_output=True,
                  text=True,
                  timeout=1200,
              )
              if result.stdout:
                  print(result.stdout)
              if result.stderr:
                  print(result.stderr)
              if result.returncode:
                  raise SystemExit("Integrated v15.1 regression suite failed")
          print("15.1 INTEGRATION OK: archive audit passed and all bundled sample regressions passed")
          PY
          node - <<'JS'
          const fs = require('node:fs');
          const source = fs.readFileSync('index.js', 'utf8');
          for (const marker of [
            "const ENGINE_151_CLI = path.join(ENGINE_151_DIR, 'deob.js')",
            "return processLuraph151(message, prompt, input, gameId, '15')",
            "isClearlyPlainLuau(input.source)",
            "async function sendOriginalLua(",
            "async function collectLuraphGameId(",
            "DEVIRT_MERGE_BUDGET: '32'",
            "const candidateMatch = receivedLine.match("
          ]) {
            if (!source.includes(marker)) throw new Error("Missing Discord routing feature: " + marker);
          }
          console.log("DISCORD ROUTING OK: v15/v15.1 dedicated engine and plain-source passthrough");
          JS
