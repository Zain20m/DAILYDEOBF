name: Verify DAILY DEOBF original Luraph engine

on:
  push:
    paths:
      - "index.js"
      - "package.json"
      - "scripts/setup-engines.js"
      - "luraph-v15-engine/**"
      - ".github/workflows/verify-full-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify bot wiring and original engine installation
        shell: bash
        run: |
          set -euo pipefail
          node --version
          python3 --version
          npm run check
          node scripts/setup-engines.js
          python3 - <<'PY'
          from pathlib import Path
          engine = Path("luraph-v15-engine/deobf")
          for source in engine.rglob("*.py"):
              if "__pycache__" not in source.parts:
                  compile(source.read_text(encoding="utf-8"), str(source), "exec")
          print("ORIGINAL_ENGINE_PYTHON_SYNTAX_OK")
          PY
          python3 luraph-v15-engine/deobf/deob.py --help >/dev/null

      - name: Verify 15.1 beta detection and bundled Luau tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          import tempfile
          engine = Path("luraph-v15-engine/deobf")
          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              sample = root / "beta.lua"
              sample.write_text(
                  "-- This file was protected using Luraph Obfuscator v15.1 [https://lura.ph/]\nreturn function() end\n",
                  encoding="utf-8"
              )
              detection = subprocess.run(
                  ["python3", str(engine / "deob.py"), str(sample), "--detect"],
                  check=True, capture_output=True, text=True
              )
              print("DETECTION=" + detection.stdout.strip())
              if not detection.stdout.startswith("luraph_v15"):
                  raise SystemExit("15.1 beta header was not detected by the original v15 lifter")
              runtime = root / "runtime.luau"
              runtime.write_text('print("Luau runtime OK")\n', encoding="utf-8")
              subprocess.run([str(engine / "bin" / "luau"), str(runtime)], check=True)
              ast = subprocess.run(
                  [str(engine / "bin" / "luau-ast"), str(runtime)],
                  check=True, capture_output=True
              )
              json.loads(ast.stdout.decode("latin-1"))
              print("LUUA_RUNTIME_AND_AST_OK")
          PY

      - name: Full-analysis smoke test against the uploaded 15.1 beta sample
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y 7zip
          SEVEN="$(command -v 7zz || command -v 7z)"
          export SEVEN
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          import subprocess
          import tempfile

          wrapper = Path("upload/Luraph_v15_1_Deobfuscator_Newest.zip")
          with ZipFile(wrapper) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit("ZIP CRC failure: " + bad)
              rar_entries = [x for x in z.infolist() if x.filename.lower().endswith(".rar")]
              if len(rar_entries) != 1:
                  raise SystemExit("Expected one nested RAR in the uploaded 15.1 ZIP")
              rar_data = z.read(rar_entries[0])

          with tempfile.TemporaryDirectory(prefix="daily-deobf-original-151-") as td:
              root = Path(td)
              rar = root / "payload.rar"
              extracted = root / "extract"
              output_dir = root / "output"
              extracted.mkdir()
              output_dir.mkdir()
              rar.write_bytes(rar_data)
              subprocess.run(
                  [os.environ["SEVEN"], "x", "-y", f"-o{extracted}", str(rar)],
                  check=True, capture_output=True
              )
              sample = extracted / "v15_tool_attempt_source/samples_v15.1_deobfuscated/2153b779fa7a87f2_obfuscated.lua"
              if not sample.is_file():
                  raise SystemExit("Uploaded 15.1 regression sample is missing")

              output = output_dir / "deobfuscated.luau"
              env = os.environ.copy()
              env.update({
                  "DEVIRT_LOADERS": "1",
                  "DEVIRT_TIMING": "1",
                  "DEVIRT_ERRS": "1",
                  "DEVIRT_TB": "1",
                  "DEVIRT_WALK_LIMIT": "750000",
              })
              cli = Path("luraph-v15-engine/deobf/deob.py").resolve()
              result = subprocess.run(
                  [
                      "python3", str(cli), str(sample), "-o", str(output),
                      "--obfuscator", "luraph_v15",
                      "--debug", "--strings", "--no-pypy",
                      "--max-runs", "20", "--devirt-rounds", "200",
                      "--budget", "90", "--timeout", "180",
                  ],
                  cwd="luraph-v15-engine/deobf", env=env,
                  capture_output=True, text=True, timeout=1200,
              )
              print("ENGINE_STDOUT:\n" + result.stdout[-5000:])
              print("ENGINE_STDERR:\n" + result.stderr[-16000:])
              base = output_dir / "deobfuscated"
              lifted = Path(str(base) + ".devirt.luau")
              prototypes = Path(str(base) + ".protos.json")
              print("FULL_LIFT_BYTES=" + str(lifted.stat().st_size if lifted.is_file() else 0))
              print("PROTO_BYTES=" + str(prototypes.stat().st_size if prototypes.is_file() else 0))
              if result.returncode != 0 or not output.is_file() or output.stat().st_size == 0:
                  raise SystemExit("Original v15 engine failed to produce a 15.1 analysis result")
              meaningful = []
              if lifted.is_file():
                  meaningful = [
                      line for line in lifted.read_text(encoding="utf-8", errors="replace").splitlines()
                      if line.strip() and not line.strip().startswith("--")
                  ]
              if meaningful:
                  print("RESULT_CLASS=FULL_VM_LIFT")
              else:
                  print("RESULT_CLASS=TRACE_FALLBACK")
                  print("The engine captured the sample but fell back to its behaviour trace.")
          PY
