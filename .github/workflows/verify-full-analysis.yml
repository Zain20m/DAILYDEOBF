name: Verify original Luraph v15 lifter on 15.1 beta

on:
  push:
    paths:
      - "index.js"
      - "package.json"
      - "scripts/setup-engines.js"
      - "luraph-v15-engine/**"
      - "upload/Luraph_v15_1_Deobfuscator_Newest.zip"
      - ".github/workflows/verify-full-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Verify app wiring, engine files and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          node --version
          python3 --version
          npm run check
          node scripts/setup-engines.js
          python3 - <<'PY'
          from pathlib import Path
          engine = Path("luraph-v15-engine/deobf")
          for path in engine.rglob("*.py"):
              if "__pycache__" not in path.parts:
                  compile(path.read_text(encoding="utf-8"), str(path), "exec")
          for name in ("luau", "luau-ast"):
              path = engine / "bin" / name
              if not path.is_file():
                  raise SystemExit("Missing original runtime binary: " + str(path))
          print("ORIGINAL_ENGINE_PYTHON_SYNTAX_OK")
          PY
          python3 luraph-v15-engine/deobf/deob.py --help >/dev/null

      - name: Run original full Luraph lifter against bundled 15.1 beta input
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y 7zip
          SEVEN="$(command -v 7zz || command -v 7z)"
          export SEVEN
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          import subprocess
          import tempfile

          wrapper = Path("upload/Luraph_v15_1_Deobfuscator_Newest.zip")
          if not wrapper.is_file():
              raise SystemExit("Missing uploaded 15.1 beta archive")
          with ZipFile(wrapper) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit("ZIP CRC check failed: " + bad)
              rar_entries = [x for x in z.infolist() if x.filename.lower().endswith(".rar")]
              if len(rar_entries) != 1:
                  raise SystemExit("Expected one nested RAR inside the uploaded ZIP")
              rar_data = z.read(rar_entries[0])

          with tempfile.TemporaryDirectory(prefix="daily-deobf-original-151-") as temp:
              root = Path(temp)
              rar = root / "payload.rar"
              extracted = root / "rar"
              outdir = root / "output"
              extracted.mkdir()
              outdir.mkdir()
              rar.write_bytes(rar_data)
              subprocess.run([os.environ["SEVEN"], "x", "-y", f"-o{extracted}", str(rar)], check=True)

              source_root = extracted / "v15_tool_attempt_source"
              sample = source_root / "samples_v15.1_deobfuscated" / "2153b779fa7a87f2_obfuscated.lua"
              if not sample.is_file():
                  raise SystemExit("Bundled 15.1 regression sample is missing")

              output = outdir / "deobfuscated.luau"
              env = os.environ.copy()
              env.update({
                  "DEVIRT_LOADERS": "1",
                  "DEVIRT_TIMING": "1",
                  "DEVIRT_ERRS": "1",
                  "DEVIRT_TB": "1",
                  "DEVIRT_WALK_LIMIT": "750000",
              })
              cli = Path("luraph-v15-engine/deobf/deob.py").resolve()
              result = subprocess.run(
                  [
                      "python3", str(cli), str(sample), "-o", str(output),
                      "--obfuscator", "luraph_v15",
                      "--debug", "--strings",
                      "--max-runs", "20",
                      "--devirt-rounds", "200",
                      "--budget", "90",
                      "--timeout", "180",
                      "--no-pypy",
                  ],
                  cwd="luraph-v15-engine/deobf",
                  env=env,
                  capture_output=True,
                  text=True,
                  timeout=1200,
              )
              print("ORIGINAL V15 STDOUT:\\n" + result.stdout[-6000:])
              print("ORIGINAL V15 STDERR:\\n" + result.stderr[-20000:])

              base = outdir / "deobfuscated"
              lifted = Path(str(base) + ".devirt.luau")
              protos = Path(str(base) + ".protos.json")
              strings = Path(str(base) + ".strings.txt")
              print("FULL_LIFT=" + str(lifted.is_file() and lifted.stat().st_size > 0))
              print("TRACE=" + str(output.is_file() and output.stat().st_size > 0))
              print("PROTOS=" + str(protos.is_file() and protos.stat().st_size > 0))
              print("STRINGS=" + str(strings.is_file() and strings.stat().st_size > 0))
              if result.returncode != 0:
                  raise SystemExit("Original v15 engine exited with " + str(result.returncode))
              if lifted.is_file() and lifted.stat().st_size:
                  print("RESULT_CLASS=FULL_VM_LIFT")
              elif output.is_file() and output.stat().st_size:
                  print("RESULT_CLASS=BEHAVIOUR_TRACE_FALLBACK")
              else:
                  raise SystemExit("The original v15 engine produced neither a lift nor a trace")
              if not protos.is_file():
                  print("WARNING=No prototype dump was retained for this beta sample")
          PY

      - name: Upload beta analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-v15-beta-analysis
          path: |
            /tmp/daily-deobf-original-151-*/output/**
          if-no-files-found: ignore
